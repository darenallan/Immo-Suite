# cargo-deny (étape 01, TESTING_QA.md §10). Exécuté le 01/11/2026 sur le poste (cargo-deny 0.20.2).
# Liste blanche de licences à relire avec un juriste [À VÉRIFIER AVEC UN JURISTE, DP-62].
[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-gnu",
]

[advisories]
version = 2
yanked = "deny"
# Chaque exception porte sa raison et sa date de revue. Les deux viennent de `age` 0.12.1 (dernière version publiée au 01/11/2026).
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 (variabilité de temps) n'est atteint que par p256, utilisé par age pour des destinataires P-256 ; Immo Suite chiffre vers un destinataire X25519 et ne fait aucune opération secrète P-256. Revue : à chaque mise à jour d'age, au plus tard le 01/02/2027." },
  { id = "RUSTSEC-2026-0374", reason = "basic-toml non maintenu : macro procédurale de compilation d'age (i18n-config), absente du binaire. Revue : à chaque mise à jour d'age, au plus tard le 01/02/2027." },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
]

# Nos propres paquets (publish = false, licence « UNLICENSED ») ne sont pas contrôlés.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

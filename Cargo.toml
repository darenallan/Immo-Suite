[workspace]
resolver = "3"
members = ["crates/domain", "crates/app", "crates/server"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false
license = "UNLICENSED"

# Lints communs (CODING_RULES.md §3.1 et §7). Les lints propres à l'argent sont posés dans crates/domain/src/lib.rs.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]
thiserror = "2"

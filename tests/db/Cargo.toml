[package]
name = "immo-db-tests"
version = "0.0.0"
description = "Tests de base de données : schéma, rôles, isolation, pool sous concurrence (TESTING_QA.md §3)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
immo-app = { path = "../../crates/app" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
age = "0.12"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
immo-server = { path = "../../crates/server" }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "std", "registry"] }

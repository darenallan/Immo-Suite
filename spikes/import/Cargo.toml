[package]
name = "spike-import"
version = "0.0.0"
edition = "2024"
publish = false

# Prototype (d), hors du build du produit (CODING_RULES.md ?1.1) : espace de travail propre.
[workspace]

[dependencies]
calamine = "0.37.0"
csv = "1.4.0"
encoding_rs = "0.8.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "json"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.29.0", features = ["v4"] }
zip = "9.2.0"
